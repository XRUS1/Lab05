<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Dragones AR</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #0a0a0a; color: #eee; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
  #ui { position: absolute; top: 0; left: 0; z-index: 10; padding: 1.2em; max-width: 400px; background: rgba(0,0,0,0.82); backdrop-filter: blur(10px); border-radius: 0 0 16px 0; border-right: 1px solid rgba(255,255,255,0.08); border-bottom: 1px solid rgba(255,255,255,0.08); }
  h1 { font-size: 1.15em; color: #50a8fc; margin-bottom: 0.4em; }
  p { font-size: 0.8em; color: #aaa; margin-bottom: 1em; line-height: 1.5; }
  #targets { display: flex; gap: 10px; margin-bottom: 1em; flex-wrap: wrap; }
  .target { width: 90px; height: 70px; border-radius: 6px; border: 2px solid #333; background: #111; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; cursor: pointer; transition: all 0.2s; }
  .target img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .target-label { position: absolute; bottom: 3px; left: 3px; font-size: 9px; color: #fff; background: rgba(0,0,0,0.7); padding: 2px 5px; border-radius: 3px; pointer-events: none; }
  .target.selected { border-color: #50a8fc; box-shadow: 0 0 12px rgba(80,168,252,0.4); transform: scale(1.05); }
  .target:not(.selected):hover { border-color: #666; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { padding: 0.75em 1.5em; background: transparent; color: #50a8fc; border: 2px solid #50a8fc; border-radius: 6px; font-size: 0.95em; cursor: pointer; transition: all 0.15s; }
  button:hover:not(:disabled) { background: #50a8fc; color: #000; }
  button:disabled { opacity: 0.3; border-color: #444; color: #666; cursor: not-allowed; }
  #btnExitAR { display: none; position: absolute; top: 10px; right: 10px; z-index: 30; background: rgba(255,50,50,0.9); color: #fff; border: none; border-radius: 6px; padding: 0.6em 1.2em; font-size: 0.85em; cursor: pointer; }
  #status { margin-top: 0.8em; font-size: 0.85em; color: #ccc; min-height: 1.4em; }
  #status.ok { color: #51cf66; }
  #status.err { color: #ff6b6b; }
  #status.warn { color: #ffd43b; }
  #status.info { color: #74c0fc; }
  #ar-overlay { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 20; background: rgba(0,0,0,0.75); padding: 10px 20px; border-radius: 24px; font-size: 0.85em; color: #fff; pointer-events: none; display: none; border: 1px solid rgba(255,255,255,0.15); }
  #xr-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
  @media (max-width: 480px) { #ui { max-width: 100%; border-radius: 0; padding: 1em; } h1 { font-size: 1em; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="ui">
  <h1>Dragones AR</h1>
  <p id="ui-text">Selecciona una tarjeta y luego toca <b>Iniciar AR</b>. Dentro de AR, toca la pantalla para colocar el dragón.</p>
  <div id="targets"></div>
  <div class="btn-row">
    <button id="btnAR" disabled>Iniciar AR</button>
    <button id="btn3D" disabled>Ver en 3D</button>
  </div>
  <div id="status">Cargando...</div>
</div>

<button id="btnExitAR">Salir de AR</button>
<div id="ar-overlay"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const TARGETS = [
  { nombre: 'Dragon Azul', tarjeta: './images/tarjeta.png', modelo: './models/Blue.glb', animacion: 'Idle01', fallbackAnimacion: 'Idle01' },
  { nombre: 'Dragon Rojo', tarjeta: './images/tarjeta2.png', modelo: './models/Red.glb', animacion: 'Idle01', fallbackAnimacion: 'Idle01' }
];

const btnAR = document.getElementById('btnAR');
const btn3D = document.getElementById('btn3D');
const btnExitAR = document.getElementById('btnExitAR');
const statusEl = document.getElementById('status');
const uiText = document.getElementById('ui-text');
const targetsDiv = document.getElementById('targets');
const arOverlay = document.getElementById('ar-overlay');

let selectedIndex = -1;
let modelosData = [];
let arState = null;
let d3 = null;

function cargarTarjetas() {
  return Promise.all(TARGETS.map((t, i) => new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const wrap = document.createElement('div');
      wrap.className = 'target';
      wrap.dataset.index = i;
      const thumb = document.createElement('img');
      thumb.src = t.tarjeta; thumb.alt = t.nombre;
      const label = document.createElement('span');
      label.className = 'target-label';
      label.textContent = t.nombre;
      wrap.appendChild(thumb);
      wrap.appendChild(label);
      targetsDiv.appendChild(wrap);
      wrap.addEventListener('click', () => seleccionarDragon(i));
      resolve();
    };
    img.onerror = () => reject(new Error(`No se pudo cargar: ${t.tarjeta}`));
    img.src = t.tarjeta;
  })));
}

function seleccionarDragon(index) {
  selectedIndex = index;
  document.querySelectorAll('.target').forEach((el, i) => el.classList.toggle('selected', i === index));
  btnAR.disabled = false;
  btn3D.disabled = false;
  if (arState && arState.scene) {
    cambiarDragonEnAR(index);
  } else {
    statusEl.textContent = `Seleccionado: ${TARGETS[index].nombre}.`;
    statusEl.className = 'ok';
  }
}

function cambiarDragonEnAR(index) {
  if (!arState || !arState.scene || !arState.model) return;
  arState.scene.remove(arState.model);
  if (arState.mixer) {
    arState.mixer.stopAllAction();
    arState.mixers = arState.mixers.filter(m => m !== arState.mixer);
  }
  const data = modelosData[index];
  const { model, mixer } = crearModelo(data);
  model.visible = false;
  arState.scene.add(model);
  arState.model = model;
  arState.mixer = mixer;
  if (mixer) arState.mixers.push(mixer);
  arState.placed = false;
  arOverlay.textContent = 'Cambiado. Toca para colocar';
  statusEl.textContent = `Cambiado a ${TARGETS[index].nombre}. Toca la pantalla.`;
  statusEl.className = 'info';
}

function cargarModelos() {
  const loader = new GLTFLoader();
  return Promise.all(TARGETS.map((t, i) => new Promise((resolve, reject) => {
    loader.load(t.modelo,
      (gltf) => resolve({ gltf, nombre: t.nombre, index: i, animacionBuscada: t.animacion, fallbackAnimacion: t.fallbackAnimacion }),
      (xhr) => { if (xhr.total) statusEl.textContent = `Descargando ${t.nombre}... ${Math.round((xhr.loaded/xhr.total)*100)}%`; },
      (err) => reject(new Error(`No se pudo cargar ${t.modelo}: ${err.message}`))
    );
  })));
}

function crearModelo(data) {
  const model = data.gltf.scene.clone();
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const s = 0.12 / maxDim;
  model.scale.setScalar(s);
  const center = box.getCenter(new THREE.Vector3());
  model.position.sub(center.multiplyScalar(s));
  model.position.y += size.y * s * 0.5;
  let mixer = null, animName = null;
  if (data.gltf.animations?.length > 0) {
    mixer = new THREE.AnimationMixer(model);
    let clip = data.gltf.animations.find(a => a.name === data.animacionBuscada);
    if (!clip && data.fallbackAnimacion) clip = data.gltf.animations.find(a => a.name === data.fallbackAnimacion);
    if (!clip) clip = data.gltf.animations[0];
    animName = clip.name;
    if (clip.name !== data.animacionBuscada) {
      console.warn(`[${data.nombre}] "${data.animacionBuscada}" no encontrada. Usando: "${animName}"`);
    }
    mixer.clipAction(clip).play();
  }
  return { model, mixer, animName };
}

async function init() {
  try {
    statusEl.textContent = 'Cargando tarjetas...';
    await cargarTarjetas();
    statusEl.textContent = 'Descargando modelos...';
    modelosData = await cargarModelos();
    statusEl.textContent = 'Listo. Selecciona un dragón.';
    statusEl.className = 'info';
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
    statusEl.className = 'err';
    console.error(err);
  }
}
init();

// ======================== MODO 3D ========================
function cleanup3D() {
  if (!d3) return;
  try {
    window.removeEventListener('resize', d3.onResize);
    cancelAnimationFrame(d3.animId);
    d3.controls.dispose();
    d3.mixers.forEach(m => m.stopAllAction());
    d3.scene.traverse(obj => {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
        else obj.material.dispose();
      }
      if (obj.texture) obj.texture.dispose();
    });
    d3.renderer.dispose();
    if (d3.renderer.domElement && d3.renderer.domElement.parentNode) {
      d3.renderer.domElement.parentNode.removeChild(d3.renderer.domElement);
    }
  } catch (e) { console.error('cleanup3D error', e); }
  d3 = null;
}

btn3D.addEventListener('click', () => {
  if (selectedIndex < 0) { statusEl.textContent = 'Primero selecciona un dragón.'; statusEl.className = 'warn'; return; }
  cleanup3D();
  cleanupAR();
  btnAR.disabled = true; btn3D.disabled = true;
  statusEl.textContent = 'Modo 3D activo.'; statusEl.className = 'info';
  arOverlay.style.display = 'none';

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.domElement.id = 'xr-canvas';
  renderer.domElement.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;';
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a12);
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.01, 100);
  camera.position.set(0, 1.2, 2.5);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.05; controls.target.set(0, 0.3, 0);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.5));
  const dl = new THREE.DirectionalLight(0xffffff, 2); dl.position.set(5, 10, 7); scene.add(dl);
  scene.add(new THREE.GridHelper(4, 20, 0x333333, 0x111111));

  const data = modelosData[selectedIndex];
  const { model, mixer } = crearModelo(data);
  scene.add(model);
  const mixers = mixer ? [mixer] : [];
  const clock = new THREE.Clock();

  function animate() {
    const id = requestAnimationFrame(animate);
    d3.animId = id;
    mixers.forEach(m => m.update(clock.getDelta()));
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  const onResize = () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  };
  window.addEventListener('resize', onResize);

  d3 = { renderer, scene, camera, controls, mixers, animId: null, onResize };
  d3.restore = () => {
    cleanup3D();
    btnAR.disabled = false; btn3D.disabled = false;
    statusEl.textContent = 'Listo.'; statusEl.className = '';
  };
});

// ======================== MODO AR ========================
function cleanupAR() {
  if (!arState || arState.cleaning) {
    console.log('[AR] cleanupAR: nada que limpiar o ya limpiando');
    return;
  }
  arState.cleaning = true;
  console.log('[AR] cleanupAR iniciado');

  const state = arState;

  if (state.renderer) {
    try { state.renderer.setAnimationLoop(null); } catch (e) {}
  }
  if (state.renderer && state.renderer.xr) {
    try { state.renderer.xr.setSession(null); } catch (e) { console.log('[AR] setSession(null) error', e); }
  }
  if (state.hitTestSource) {
    try { state.hitTestSource.cancel(); } catch (e) {}
    state.hitTestSource = null;
  }
  if (state.session && !state.session.ended) {
    try { state.session.end(); } catch (e) { console.log('[AR] session.end() error', e); }
  }
  state.mixers.forEach(m => { try { m.stopAllAction(); } catch (e) {} });
  if (state.scene) {
    state.scene.traverse(obj => {
      try {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
          else obj.material.dispose();
        }
        if (obj.texture) obj.texture.dispose();
      } catch (e) {}
    });
  }
  if (state.renderer) {
    try { state.renderer.dispose(); } catch (e) {}
    if (state.renderer.domElement && state.renderer.domElement.parentNode) {
      try { state.renderer.domElement.parentNode.removeChild(state.renderer.domElement); } catch (e) {}
    }
  }

  btnExitAR.style.display = 'none';
  arOverlay.style.display = 'none';
  uiText.innerHTML = 'Selecciona una tarjeta y luego toca <b>Iniciar AR</b>.';
  btnAR.disabled = false;
  btn3D.disabled = false;
  if (!state.errorMsg) {
    statusEl.textContent = 'AR finalizado.';
    statusEl.className = '';
  }

  if (d3 && d3.restore) {
    try { d3.restore(); } catch (e) {}
  }

  arState = null;
  console.log('[AR] cleanupAR completado');
}

btnExitAR.addEventListener('click', () => {
  console.log('[AR] btnExitAR click');
  if (arState) arState.errorMsg = null;
  cleanupAR();
});

async function obtenerRefSpace(session) {
  const tipos = ['local-floor', 'local', 'viewer'];
  for (const tipo of tipos) {
    try {
      console.log('[AR] Intentando refSpace:', tipo);
      const refSpace = await session.requestReferenceSpace(tipo);
      console.log('[AR] refSpace OK:', tipo);
      return { refSpace, tipo };
    } catch (e) {
      console.warn('[AR] refSpace falló:', tipo, e.message);
    }
  }
  throw new Error('Ningún reference space soportado');
}

btnAR.addEventListener('click', async () => {
  console.log('[AR] btnAR click');

  if (arState) {
    statusEl.textContent = 'AR ya está activo. Toca "Salir de AR" primero.';
    statusEl.className = 'warn';
    return;
  }
  if (selectedIndex < 0) {
    statusEl.textContent = 'Primero selecciona un dragón.';
    statusEl.className = 'warn';
    return;
  }
  if (!navigator.xr) {
    statusEl.textContent = 'WebXR no disponible.';
    statusEl.className = 'err';
    return;
  }

  cleanup3D();

  btnAR.disabled = true;
  btn3D.disabled = true;
  statusEl.textContent = 'Verificando AR...';
  statusEl.className = 'info';

  let supported = false;
  try {
    supported = await navigator.xr.isSessionSupported('immersive-ar');
    console.log('[AR] immersive-ar soportado:', supported);
  } catch (e) {
    console.error('[AR] isSessionSupported error:', e);
    statusEl.textContent = 'Error: ' + e.message;
    statusEl.className = 'err';
    btnAR.disabled = false; btn3D.disabled = false;
    return;
  }

  if (!supported) {
    statusEl.textContent = 'AR no soportado. Necesitas Chrome Android con ARCore.';
    statusEl.className = 'err';
    btnAR.disabled = false; btn3D.disabled = false;
    return;
  }

  statusEl.textContent = 'Iniciando sesión AR...';

  let session;
  try {
    session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: [],
      optionalFeatures: ['hit-test', 'dom-overlay'],
      domOverlay: { root: document.body }
    });
    console.log('[AR] Sesión creada correctamente');
  } catch (err) {
    console.error('[AR] requestSession error:', err);
    if (err.message && (err.message.includes('could not be fulfilled') || err.message.includes('invalid'))) {
      try {
        console.log('[AR] Reintentando sin features...');
        session = await navigator.xr.requestSession('immersive-ar');
        console.log('[AR] Sesión creada (sin features)');
      } catch (err2) {
        console.error('[AR] requestSession retry error:', err2);
        statusEl.textContent = 'Error AR: ' + err2.message;
        statusEl.className = 'err';
        btnAR.disabled = false; btn3D.disabled = false;
        return;
      }
    } else {
      statusEl.textContent = 'Error AR: ' + err.message;
      statusEl.className = 'err';
      btnAR.disabled = false; btn3D.disabled = false;
      return;
    }
  }

  statusEl.textContent = 'AR iniciado. Configurando escena...';

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.xr.enabled = true;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.domElement.id = 'xr-canvas';
  renderer.domElement.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;';
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.01, 100);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
  const dl = new THREE.DirectionalLight(0xffffff, 1.5); dl.position.set(5, 10, 7); scene.add(dl);

  const data = modelosData[selectedIndex];
  const { model, mixer } = crearModelo(data);
  model.visible = false;
  scene.add(model);

  const mixers = mixer ? [mixer] : [];
  const clock = new THREE.Clock();

  arState = {
    session, renderer, scene, camera, model, mixer, mixers, clock,
    hitTestSource: null, hitTestResults: [], refSpace: null, refSpaceType: null,
    placed: false, cleaning: false, errorMsg: null
  };

  try {
    console.log('[AR] setSession...');
    await renderer.xr.setSession(session);
    console.log('[AR] setSession OK');
  } catch (err) {
    console.error('[AR] setSession error:', err);
    arState.errorMsg = 'Error configurando renderer: ' + err.message;
    statusEl.textContent = arState.errorMsg;
    statusEl.className = 'err';
    cleanupAR();
    return;
  }

  let refSpaceResult;
  try {
    refSpaceResult = await obtenerRefSpace(session);
    arState.refSpace = refSpaceResult.refSpace;
    arState.refSpaceType = refSpaceResult.tipo;
  } catch (err) {
    console.error('[AR] No se pudo obtener ningún refSpace:', err);
    arState.errorMsg = 'Error: ' + err.message;
    statusEl.textContent = arState.errorMsg;
    statusEl.className = 'err';
    cleanupAR();
    return;
  }

  let hasHitTest = false;
  try {
    console.log('[AR] requestHitTestSource...');
    const viewerSpace = await session.requestReferenceSpace('viewer');
    arState.hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
    hasHitTest = true;
    console.log('[AR] hitTest OK');
  } catch (err) {
    console.warn('[AR] hit-test no disponible:', err.message);
    hasHitTest = false;
  }

  console.log('[AR] Escena configurada. refSpace=' + arState.refSpaceType + ' hasHitTest=' + hasHitTest);
  btnExitAR.style.display = 'block';
  arOverlay.style.display = 'block';
  uiText.innerHTML = hasHitTest
    ? 'Dentro de AR. Puedes <b>cambiar de dragón</b> tocando otra tarjeta. Toca la pantalla para colocar o mover.'
    : 'Dentro de AR. <b>Hit-test no disponible</b>. El dragón aparecerá frente a ti.';
  statusEl.textContent = hasHitTest ? 'AR activo. Mueve el dispositivo buscando una superficie.' : 'AR activo (sin hit-test).';
  statusEl.className = 'ok';

  if (!hasHitTest) {
    arState.model.visible = true;
    arState.model.position.set(0, 0, -1.5);
    arState.placed = true;
    arOverlay.textContent = '✓ ' + TARGETS[selectedIndex].nombre;
  }

  const onSelect = () => {
    if (!arState || arState.cleaning) return;
    if (hasHitTest && arState.hitTestResults.length > 0 && arState.model) {
      const pose = arState.hitTestResults[0].getPose(arState.refSpace);
      if (pose) {
        const t = pose.transform;
        arState.model.position.set(t.position.x, t.position.y, t.position.z);
        arState.model.quaternion.set(t.orientation.x, t.orientation.y, t.orientation.z, t.orientation.w);
        arState.model.visible = true;
        arState.placed = true;
        arOverlay.textContent = '✓ ' + TARGETS[selectedIndex].nombre;
        statusEl.textContent = 'Dragón colocado. Toca otra vez para moverlo.';
      }
    } else if (!hasHitTest && arState.model) {
      arState.model.position.z -= 0.3;
      arState.model.visible = true;
      arOverlay.textContent = '✓ ' + TARGETS[selectedIndex].nombre;
      statusEl.textContent = 'Dragón movido.';
    }
  };
  session.addEventListener('select', onSelect);

  const onEnd = () => {
    console.log('[AR] Evento end disparado');
    if (arState && !arState.cleaning) {
      cleanupAR();
    }
  };
  session.addEventListener('end', onEnd);

  const onResize = () => {
    if (!arState) return;
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  };
  window.addEventListener('resize', onResize);

  renderer.setAnimationLoop((time, frame) => {
    if (!arState || arState.cleaning) return;
    const delta = arState.clock.getDelta();
    arState.mixers.forEach(m => { if (m) m.update(delta); });

    if (frame && hasHitTest && arState.hitTestSource) {
      try {
        arState.hitTestResults = frame.getHitTestResults(arState.hitTestSource);
      } catch (e) {
        arState.hitTestResults = [];
      }
      if (!arState.placed) {
        if (arState.hitTestResults.length > 0) {
          arOverlay.textContent = 'Toca para colocar';
          statusEl.textContent = 'Superficie detectada. Toca la pantalla.';
        } else {
          arOverlay.textContent = 'Mueve el dispositivo...';
          statusEl.textContent = 'Buscando superficie...';
        }
      }
    }
    renderer.render(scene, camera);
  });
});
</script>
</body>
</html>
