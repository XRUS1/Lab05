<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
<title>Dragones AR</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { touch-action: none; overflow: hidden; width: 100vw; height: 100vh; background: #000; }
  #ui { position: absolute; top: 0; left: 0; z-index: 10; padding: 1.2em; max-width: 400px; background: rgba(0,0,0,0.82); backdrop-filter: blur(10px); border-radius: 0 0 16px 0; border-right: 1px solid rgba(255,255,255,0.08); border-bottom: 1px solid rgba(255,255,255,0.08); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  h1 { font-size: 1.15em; color: #50a8fc; margin-bottom: 0.4em; }
  p { font-size: 0.8em; color: #aaa; margin-bottom: 1em; line-height: 1.5; }
  #targets { display: flex; gap: 10px; margin-bottom: 1em; flex-wrap: wrap; }
  .target { width: 90px; height: 70px; border-radius: 6px; border: 2px solid #333; background: #111; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; cursor: pointer; transition: all 0.2s; }
  .target img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .target-label { position: absolute; bottom: 3px; left: 3px; font-size: 9px; color: #fff; background: rgba(0,0,0,0.7); padding: 2px 5px; border-radius: 3px; pointer-events: none; }
  .target.selected { border-color: #50a8fc; box-shadow: 0 0 12px rgba(80,168,252,0.4); transform: scale(1.05); }
  #btnAR { padding: 0.75em 1.5em; background: transparent; color: #50a8fc; border: 2px solid #50a8fc; border-radius: 6px; font-size: 0.95em; cursor: pointer; transition: all 0.15s; }
  #btnAR:hover:not(:disabled) { background: #50a8fc; color: #000; }
  #btnAR:disabled { opacity: 0.3; border-color: #444; color: #666; cursor: not-allowed; }
  #status { margin-top: 0.8em; font-size: 0.85em; color: #ccc; min-height: 1.4em; }
  #status.ok { color: #51cf66; }
  #status.err { color: #ff6b6b; }
  #status.info { color: #74c0fc; }
  @media (max-width: 480px) { #ui { max-width: 100%; border-radius: 0; padding: 1em; } h1 { font-size: 1em; } }
</style>
<script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "./build/three.module.js",
    "three/addons/": "./jsm/"
  }
}
</script>
</head>
<body>

<div id="ui">
  <h1>Dragones AR</h1>
  <p>Selecciona un dragón y luego toca <b>Iniciar AR</b>.</p>
  <div id="targets"></div>
  <button id="btnAR" disabled>Iniciar AR</button>
  <div id="status">Cargando...</div>
</div>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ============================================================
// AJUSTES RÁPIDOS
// ============================================================
const ESCALA_DRAGON = 1.0;
const ALTURA_DRAGON = -0.3;
// ============================================================

const TARGETS = [
  { nombre: 'Dragon Azul', tarjeta: './images/tarjeta.png', modelo: './models/Blue.glb', animacion: 'idle01' },
  { nombre: 'Dragon Rojo', tarjeta: './images/tarjeta2.png', modelo: './models/Red.glb', animacion: 'idle01' }
];

const btnAR = document.getElementById('btnAR');
const statusEl = document.getElementById('status');
const targetsDiv = document.getElementById('targets');

let selectedIndex = -1;
let modelosData = [];
let dragonContainer = null;
let dragonMixer = null;
let scene, camera, renderer, clock;

function cargarTarjetas() {
  return Promise.all(TARGETS.map((t, i) => new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const wrap = document.createElement('div');
      wrap.className = 'target';
      wrap.dataset.index = i;
      const thumb = document.createElement('img');
      thumb.src = t.tarjeta;
      thumb.alt = t.nombre;
      const label = document.createElement('span');
      label.className = 'target-label';
      label.textContent = t.nombre;
      wrap.appendChild(thumb);
      wrap.appendChild(label);
      targetsDiv.appendChild(wrap);
      wrap.addEventListener('click', () => seleccionarDragon(i));
      resolve();
    };
    img.onerror = () => reject(new Error('No se pudo cargar: ' + t.tarjeta));
    img.src = t.tarjeta;
  })));
}

function seleccionarDragon(index) {
  selectedIndex = index;
  document.querySelectorAll('.target').forEach((el, i) => {
    el.classList.toggle('selected', i === index);
  });
  btnAR.disabled = false;
  statusEl.textContent = 'Seleccionado: ' + TARGETS[index].nombre + '. Toca Iniciar AR.';
  statusEl.className = 'ok';
}

function cargarModelos() {
  const loader = new GLTFLoader();
  return Promise.all(TARGETS.map((t, i) => new Promise((resolve, reject) => {
    loader.load(t.modelo,
      (gltf) => resolve({ gltf, nombre: t.nombre, index: i, animacionBuscada: t.animacion }),
      undefined,
      (err) => reject(new Error('No se pudo cargar ' + t.modelo + ': ' + err.message))
    );
  })));
}

function crearModelo(data) {
  const container = new THREE.Group();
  const model = data.gltf.scene.clone();
  
  console.log('=== DRAGON DEBUG ===');
  console.log('Animaciones:', data.gltf.animations.length);
  data.gltf.animations.forEach((clip, i) => {
    console.log(`  [${i}] "${clip.name}" | dur: ${clip.duration} | tracks: ${clip.tracks.length}`);
    clip.tracks.forEach((track, j) => {
      console.log(`    track ${j}: ${track.name} (${track.constructor.name})`);
    });
  });

  container.scale.set(ESCALA_DRAGON, ESCALA_DRAGON, ESCALA_DRAGON);
  container.rotation.y = Math.PI;

  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  model.position.set(-center.x, -center.y, -center.z);
  
  container.add(model);

  let mixer = null;
  if (data.gltf.animations && data.gltf.animations.length > 0) {
    mixer = new THREE.AnimationMixer(model);
    const clip = data.gltf.animations[0];
    const action = mixer.clipAction(clip);
    action.play();
  }
  
  return { container, mixer, model };
}

async function init() {
  try {
    statusEl.textContent = 'Cargando tarjetas...';
    await cargarTarjetas();
    statusEl.textContent = 'Descargando modelos...';
    modelosData = await cargarModelos();
    statusEl.textContent = 'Listo. Selecciona un dragón.';
    statusEl.className = 'info';
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
    statusEl.className = 'err';
    console.error(err);
  }
}
init();

function iniciarAR() {
  if (selectedIndex < 0) {
    statusEl.textContent = 'Primero selecciona un dragón.';
    statusEl.className = 'warn';
    return;
  }

  const data = modelosData[selectedIndex];
  
  // DEBUG: mostrar info en status
  const numAnims = data.gltf.animations.length;
  const nombres = data.gltf.animations.map(a => a.name).join(', ');
  statusEl.textContent = `Anims: ${numAnims} | ${nombres || 'NINGUNA'}`;
  statusEl.className = 'info';
  
  // Esperar 2 segundos para leer, luego entrar a AR
  setTimeout(() => {
    document.getElementById('ui').style.display = 'none';

    clock = new THREE.Clock();
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

    scene.add(new THREE.HemisphereLight(0xa5a5a5, 0x898989, 3));

    const light = new THREE.DirectionalLight(0xffffff, 3);
    light.position.set(1, 1, 1).normalize();
    scene.add(light);

    // NAVE
    const loaderNave = new GLTFLoader();
    loaderNave.load(
      './models/gltf/Nave.gltf',
      function (gltf) {
        gltf.scene.scale.set(0.003, 0.003, 0.003);
        gltf.scene.position.set(-0.8, 0.3, -1.5);
        scene.add(gltf.scene);
      },
      undefined,
      function (error) {
        console.error('Error cargando la nave:', error);
      }
    );

    // DRAGÓN
    const { container, mixer } = crearModelo(data);
    container.position.set(2.0, ALTURA_DRAGON, -1.5);
    scene.add(container);
    dragonContainer = container;
    dragonMixer = mixer;

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    document.body.appendChild(ARButton.createButton(renderer));

    window.addEventListener('resize', onWindowResize);

    renderer.setAnimationLoop(animate);
    
  }, 2000);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  const delta = clock.getDelta();
  if (dragonMixer) dragonMixer.update(delta);
  renderer.render(scene, camera);
}

btnAR.addEventListener('click', iniciarAR);
</script>
</body>
</html>
